<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreuzworträtsel – Weihnachten</title>

  <!-- Festive Calligraphy Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding-top: 20px;
      background: linear-gradient(#f8f8f8, #d8e3f0);
      background-image:
        url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Ctext x="10" y="55" font-size="20" fill="%23e0e0e0"%3E✻%3C/text%3E%3C/svg%3E'),
        url('data:image/svg+xml,%3Csvg width="120" height="120" xmlns="http://www.w3.org/2000/svg"%3E%3Ctext x="15" y="65" font-size="22" fill="%23f2d4d4"%3E✦%3C/text%3E%3C/svg%3E');
      background-repeat: repeat;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #b30000;
      margin: 0;
      text-shadow: 0 0 4px rgba(255,255,255,0.7);
    }

    h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: #b30000;
      margin: 0;
      text-shadow: 0 0 4px rgba(255,255,255,0.7);
    }

    /* Snowflakes */
    .snowflake {
      position: fixed;
      top: -10px;
      color: white;
      font-size: 20px;
      opacity: 0.75;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    /* Top bar */
    #infoBar {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    #hintButton {
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      background: white;
      color: #b30000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 9px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    #hintButton svg {
      width: 18px;
      height: 18px;
      stroke: #b30000;
      stroke-width: 2;
    }

    #hintButton:hover {
      background: #ffecec;
      transform: translateY(-1px);
    }

    #hintButton.active {
      background: #b30000;
      color: white;
      box-shadow: 0 0 10px rgba(179,0,0,0.7);
    }
    #hintButton.active svg {
      stroke: #ffffff;
    }

    /* Puzzle frame */
    #frame {
      padding: 15px;
      border: 8px solid #b30000;
      border-radius: 20px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      margin-top: 20px;
      transition: all 0.8s ease;
      position: relative;
    }

    /* Crossword grid */
    #puzzle {
      display: grid;
      grid-template-columns: repeat(15, min(32px, 5vw));
      grid-auto-rows: min(32px, 5vw);
      gap: 2px;
      transition: opacity 0.6s ease;
      justify-content: center;
    }

    .cross-cell {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .cross-cell.block {
      background: #333;
      border: none;
    }

    .cross-cell.active-word {
      background: #fff6d5;
      box-shadow: 0 0 0 2px rgba(212,175,55,0.6);
    }

    .cross-cell.active-cell {
      background: #ffe4cc;
      box-shadow: 0 0 0 2px rgba(179,0,0,0.6);
    }

    .cross-input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      color: #222;
    }

    .cross-input.incorrect {
      color: #b30000;
    }

    .cross-input:focus {
      box-shadow: 0 0 0 2px rgba(179, 0, 0, 0.4);
      border-radius: 3px;
    }

    /* hide original image but keep for layout parity if needed */
    #fullImage {
      display: none;
    }

    #winMessage {
      margin-top: 18px;
      background: rgba(255,255,255,0.94);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 17px;
      box-shadow: 0 0 12px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(18px);
      transition: all 0.8s ease;
      display: none;
      text-align: center;
      max-width: 92vw;
    }

    #winMessage h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.3rem;
      margin: 0;
      background: linear-gradient(45deg, #b30000, #d4af37, #008000);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 7px rgba(255,255,255,0.7);
      animation: winPop 0.9s ease-out forwards, glow 2s ease-in-out infinite alternate;
    }

    @keyframes winPop {
      0% { transform: scale(0.5) rotate(-6deg); opacity: 0; }
      60% { transform: scale(1.12) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes glow {
      0% { text-shadow: 0 0 6px rgba(255,255,255,0.6); }
      100% { text-shadow: 0 0 12px rgba(255,255,255,1); }
    }

    #restartButton {
      padding: 10px 18px;
      border-radius: 999px;
      background: #b30000;
      color: white;
      border: none;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease, background 0.2s ease;
    }

    #restartButton:hover {
      background: #d00000;
    }

    @keyframes confettiFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* Bottom sliding clue popup */
    #clueBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      transform: translateY(100%);
      transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 -4px 14px rgba(0,0,0,0.25);
      padding: 10px 16px 14px;
      display: flex;
      justify-content: center;
      z-index: 9999;
    }

    #clueInner {
      max-width: 800px;
      width: 100%;
      text-align: center;
      font-size: 15px;
      color: #333;
    }

    #clueLabel {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b30000;
      margin-bottom: 4px;
      font-weight: 600;
    }

    #clueText {
      font-size: 15px;
    }

    #clueBar.visible {
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      #frame {
        max-width: 95vw;
      }
      #puzzle {
        grid-template-columns: repeat(15, min(8vw, 30px));
        grid-auto-rows: min(8vw, 30px);
      }
      #clueText {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Confetti canvas -->
  <canvas id="confettiCanvas"
          style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                 pointer-events: none; z-index: 999999; display: none;"></canvas>

  <h1>Felice Adventskalender</h1>
  <h2>Türchen 1 🎄🎁</h2>

  <div id="infoBar">
    <button id="hintButton" type="button">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <circle cx="12" cy="16" r="1"></circle>
      </svg>

    </button>
  </div>

  <div id="frame">

    <!-- Just kept for parity if needed; not shown -->
    <img id="fullImage" src="IMG_4698.png" alt="Puzzle Bild">
  </div>

  <div id="winMessage">
    <h2>Geschafft!</h2>

    <div id="clueInner">
      <div id="clueLabel">Hinweis</div>
      <div id="clueText"></div>
    </div>
  </div>

<script>
/* Snowflakes */
for (let i = 0; i < 20; i++) {
  const f = document.createElement('div');
  f.className = 'snowflake';
  f.textContent = '❅';
  f.style.left = Math.random() * 100 + 'vw';
  f.style.animationDuration = 5 + Math.random() * 5 + 's';
  f.style.animationDelay = Math.random() * 5 + 's';
  document.body.appendChild(f);
}

/* ==========================
   Crossword Data
========================== */

const solutionRows = [
  "AC#SAHARA#J##A#",
  "##DI###ONEPIECE",
  "#KATZE#BL#M##HI",
  "TINTE#GEA#OCHSE",
  "ZWIEBLINGER#AER",
  "#IE##IR#E#G#M##",
  "##LASZLO##ANIME",
  "FA#S#EM#KANAL#U",
  "INDIANA#A##STAR",
  "NOTARZT#METEORO",
  "GM####H#I#F#N#P",
  "EICHHOERNCHEN#A",
  "REUTLINGEN#T###"
];

const ROWS = solutionRows.length;
const COLS = solutionRows[0].length;

/* Entries (only real answers) */

const entries = [
  // ACROSS
  { num: 1, answer: "AC", row: 0, col: 0, dir: "across", clue: "engl. Abk. Klimaanlage" },
  { num: 2, answer: "SAHARA", row: 0, col: 3, dir: "across", clue: "größte Trockenwüste der Erde" },
  { num: 3, answer: "ONEPIECE", row: 1, col: 7, dir: "across", clue: "ein Stück (cool)" },
  { num: 4, answer: "KATZE", row: 2, col: 1, dir: "across", clue: "Wohnungs-Essential" },
  { num: 5, answer: "TINTE", row: 3, col: 0, dir: "across", clue: "Umbridge hat es Harry zur Strafe weggenommen" },
  { num: 6, answer: "OCHSE", row: 3, col: 10, dir: "across", clue: "männliches kastriertes Rind" },
  { num: 7, answer: "ZWIEBLINGER", row: 4, col: 0, dir: "across", clue: "wichtige Zutat für viele Gerichte" },
  { num: 8, answer: "LASZLO", row: 6, col: 2, dir: "across", clue: "rebellischer Widerstandskämpfer im Film Casablanca" },
  { num: 9, answer: "ANIME", row: 6, col: 10, dir: "across", clue: "crunchyroll regelt" },
  { num: 10, answer: "KANAL", row: 7, col: 8, dir: "across", clue: "Pro7" },
  { num: 11, answer: "INDIANA", row: 8, col: 0, dir: "across", clue: "US-Bundesstaat" },
  { num: 12, answer: "STAR", row: 8, col: 11, dir: "across", clue: "Taylor Swift" },
  { num: 13, answer: "NOTARZT", row: 9, col: 0, dir: "across", clue: "wo geht man hin, wenn man früher von der Arbeit weg muss?" },
  { num: 14, answer: "METEORO", row: 9, col: 8, dir: "across", clue: "Sternschnuppe auf Spanisch (romantisch dies das)" },
  { num: 15, answer: "EICHHOERNCHEN", row: 11, col: 0, dir: "across", clue: "Uno Revers - In Frankfurt füttert es uns in New York ist es umgekehrt" },
  { num: 16, answer: "REUTLINGEN", row: 12, col: 0, dir: "across", clue: "wenn du da studierst, bist du cool" },

  // DOWN
  { num: 17, answer: "FINGER", row: 7, col: 0, dir: "down", clue: "fünf davon hast du an jeder Hand" },
  { num: 18, answer: "KIWI", row: 2, col: 1, dir: "down", clue: "mag Felice - die Frucht oder den Vogel?" },
  { num: 19, answer: "ANOMIE", row: 7, col: 1, dir: "down", clue: "Zustand der Normlosigkeit oder des Zusammenbruchs gesellschaftlicher Normen" },
  { num: 20, answer: "DANIEL", row: 1, col: 2, dir: "down", clue: "ein richtiger Ochse" },
  { num: 21, answer: "SITTE", row: 0, col: 3, dir: "down", clue: "traditionelle Verhaltensregel" },
  { num: 22, answer: "ASIA", row: 6, col: 3, dir: "down", clue: "größter Kontinent auf Englisch" },
  { num: 23, answer: "LIZENZ", row: 4, col: 5, dir: "down", clue: "James Bond hat sie zum töten, ich nur zum Boot fahren" },
  { num: 24, answer: "ROBEN", row: 0, col: 7, dir: "down", clue: "Amtstracht määßiggg" },
  { num: 25, answer: "ANLAGE", row: 0, col: 8, dir: "down", clue: "manchmal im Auto, manchmal im Depot und manchmal auch mit Park davor" },
  { num: 26, answer: "KAMINE", row: 7, col: 8, dir: "down", clue: "gibt es viele in der Winkelgasse - nicht gut wenn du nuschelst" },
  { num: 27, answer: "JPMORGAN", row: 0, col: 10, dir: "down", clue: "eine Bank" },
  { num: 28, answer: "GIRLMATH", row: 3, col: 6, dir: "down", clue: "wenn 20 + 4 = 807 ergibt" },
  { num: 29, answer: "TFH", row: 9, col: 10, dir: "down", clue: "Abk. Technische Fachhochschule" },
  { num: 30, answer: "NASE", row: 6, col: 11, dir: "down", clue: "Deine ist perfekt" },
  { num: 31, answer: "ET", row: 11, col: 11, dir: "down", clue: "e in etc." },
  { num: 32, answer: "ACHSE", row: 0, col: 13, dir: "down", clue: "beim Ballett hast du Pirouetten um deine eigene gemacht" },
  { num: 33, answer: "EIER", row: 1, col: 14, dir: "down", clue: "mag Felice nicht" },
  { num: 34, answer: "EUROPA", row: 6, col: 14, dir: "down", clue: "Dame auf der Rückseite der griechischen 2EUR Münze" }
];

/* ==========================
   Global Variables
========================== */

const puzzleEl = document.getElementById("puzzle");
const winMessage = document.getElementById("winMessage");
const restartBtn = document.getElementById("restartButton");
const hintButton = document.getElementById("hintButton");
const clueBar = document.getElementById("clueBar");
const clueTextEl = document.getElementById("clueText");

const letterInputs = [];
let cellMeta = [];
let activeEntryIndex = null;
let activeDir = null;
let lastRow = null;
let lastCol = null;
let hintModeActive = false;
let hasWon = false;

/* Confetti setup */
const confettiCanvas = document.getElementById("confettiCanvas");
const ctx = confettiCanvas.getContext("2d");
let confettiPieces = [];
let confettiActive = false;

/* ==========================
   Confetti Engine
========================== */

function startConfetti() {
  confettiActive = true;
  confettiCanvas.style.display = "block";
  resizeCanvas();
  createConfetti();
  requestAnimationFrame(updateConfetti);
  setTimeout(() => fadeOutConfetti(), 2000);
}

function fadeOutConfetti() {
  confettiCanvas.style.animation = "confettiFadeOut 2.5s forwards";
  setTimeout(() => {
    stopConfetti();
    confettiCanvas.style.animation = "";
  }, 2100);
}

function stopConfetti() {
  confettiActive = false;
  confettiPieces = [];
  confettiCanvas.style.display = "none";
}

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);

function createConfetti() {
  const colors = ["#b30000", "#d4af37", "#ffffff", "#008000"];
  confettiPieces = [];
  for (let i = 0; i < 260; i++) {
    confettiPieces.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height - confettiCanvas.height,
      size: Math.random() * 7 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 3 + 1.5,
      angle: Math.random() * Math.PI * 2,
      spin: Math.random() * 0.12 - 0.06
    });
  }
}

function updateConfetti() {
  if (!confettiActive) return;

  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  confettiPieces.forEach(p => {
    p.y += p.speed;
    p.angle += p.spin;

    ctx.fillStyle = p.color;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  });

  confettiPieces = confettiPieces.filter(p => p.y < confettiCanvas.height);

  requestAnimationFrame(updateConfetti);
}

/* ==========================
   Crossword Setup
========================== */

function initCrossword() {
  puzzleEl.innerHTML = "";
  letterInputs.length = 0;
  cellMeta = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => ({ across: null, down: null, cell: null }))
  );
  activeEntryIndex = null;
  activeDir = null;
  lastRow = null;
  lastCol = null;
  hasWon = false;
  hintModeActive = false;
  hintButton.classList.remove("active");
  clueBar.classList.remove("visible");

  winMessage.style.display = "none";
  winMessage.style.opacity = "0";
  restartBtn.style.opacity = "0";
  restartBtn.style.transform = "translateY(8px)";

  // Build grid
  for (let r = 0; r < ROWS; r++) {
    const rowStr = solutionRows[r];
    for (let c = 0; c < COLS; c++) {
      const ch = rowStr[c];
      const cell = document.createElement("div");
      cell.className = "cross-cell";

      if (ch === "#") {
        cell.classList.add("block");
      } else {
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 1;
        input.className = "cross-input";
        input.dataset.correct = ch.toUpperCase();
        input.dataset.row = r;
        input.dataset.col = c;

        input.addEventListener("input", handleInput);
        input.addEventListener("focus", () => {
          selectCell(r, c);
          setTimeout(() => input.select(), 0);
        });
        input.addEventListener("click", () => {
          selectCell(r, c, true);
        });

        cell.appendChild(input);
        letterInputs.push(input);

        cellMeta[r][c].cell = cell;
      }
      puzzleEl.appendChild(cell);
    }
  }

  // Map entries to cells
  entries.forEach((entry, entryIndex) => {
    entry.cells = [];
    const len = entry.answer.length;
    for (let i = 0; i < len; i++) {
      const rr = entry.row + (entry.dir === "down" ? i : 0);
      const cc = entry.col + (entry.dir === "across" ? i : 0);
      entry.cells.push({ row: rr, col: cc });

      if (!cellMeta[rr][cc]) continue;
      cellMeta[rr][cc][entry.dir] = { entryIndex, index: i };
    }
  });
}

/* ==========================
   Selection & Highlighting
========================== */

function clearHighlights() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const meta = cellMeta[r][c];
      if (meta && meta.cell) {
        meta.cell.classList.remove("active-word", "active-cell");
      }
    }
  }
}

function showClueForEntry(entryIndex) {
  if (entryIndex == null) {
    clueBar.classList.remove("visible");
    clueTextEl.textContent = "";
    return;
  }
  const entry = entries[entryIndex];
  clueTextEl.textContent = entry.clue || "";
  clueBar.classList.add("visible");
}

function selectCell(row, col, toggleDirection = false) {
  const meta = cellMeta[row][col];
  if (!meta || !meta.cell) {
    activeEntryIndex = null;
    activeDir = null;
    clearHighlights();
    showClueForEntry(null);
    return;
  }

  let chosenDir = null;
  let chosenEntryIndex = null;

  const hasAcross = !!meta.across;
  const hasDown = !!meta.down;

  if (toggleDirection && lastRow === row && lastCol === col && hasAcross && hasDown) {
    // Toggle direction
    if (activeDir === "across" && hasDown) {
      chosenDir = "down";
      chosenEntryIndex = meta.down.entryIndex;
    } else if (activeDir === "down" && hasAcross) {
      chosenDir = "across";
      chosenEntryIndex = meta.across.entryIndex;
    } else if (hasAcross) {
      chosenDir = "across";
      chosenEntryIndex = meta.across.entryIndex;
    } else if (hasDown) {
      chosenDir = "down";
      chosenEntryIndex = meta.down.entryIndex;
    }
  } else {
    // First selection or different cell → prefer across, else down
    if (hasAcross) {
      chosenDir = "across";
      chosenEntryIndex = meta.across.entryIndex;
    } else if (hasDown) {
      chosenDir = "down";
      chosenEntryIndex = meta.down.entryIndex;
    }
  }

  activeEntryIndex = chosenEntryIndex;
  activeDir = chosenDir;
  lastRow = row;
  lastCol = col;

  clearHighlights();

  if (activeEntryIndex != null) {
    const entry = entries[activeEntryIndex];
    entry.cells.forEach(pos => {
      const cell = cellMeta[pos.row][pos.col].cell;
      if (cell) {
        cell.classList.add("active-word");
      }
    });
    const thisCell = cellMeta[row][col].cell;
    if (thisCell) thisCell.classList.add("active-cell");
  } else {
    const thisCell = cellMeta[row][col].cell;
    if (thisCell) thisCell.classList.add("active-cell");
  }

  showClueForEntry(activeEntryIndex);
}

/* ==========================
   Input / Hint / Movement
========================== */

function handleInput(e) {
  const input = e.target;
  const row = parseInt(input.dataset.row, 10);
  const col = parseInt(input.dataset.col, 10);

  let val = input.value;
  if (!val) {
    if (hintModeActive) applyHintMode();
    return;
  }

  val = val.charAt(0).toUpperCase();
  input.value = val;

  if (hintModeActive) {
    applyHintMode();
  }

  // Auto-advance within active word
  if (activeEntryIndex != null && activeDir) {
    const meta = cellMeta[row][col][activeDir];
    if (meta) {
      const entry = entries[meta.entryIndex];
      const nextIndex = meta.index + 1;
      if (nextIndex < entry.answer.length) {
        const nextPos = entry.cells[nextIndex];
        const nextMeta = cellMeta[nextPos.row][nextPos.col];
        if (nextMeta && nextMeta.cell) {
          const nextInput = nextMeta.cell.querySelector("input");
          if (nextInput) {
            nextInput.focus();
          }
        }
      }
    }
  } else {
    // no active word: go right if possible
    if (col + 1 < COLS && cellMeta[row][col + 1].cell) {
      const nextInput = cellMeta[row][col + 1].cell.querySelector("input");
      if (nextInput) nextInput.focus();
    }
  }

  checkWin();
}

function applyHintMode() {
  if (!hintModeActive) {
    letterInputs.forEach(inp => inp.classList.remove("incorrect"));
    return;
  }
  letterInputs.forEach(inp => {
    const val = inp.value.toUpperCase();
    const correct = inp.dataset.correct;
    if (val && val !== correct) {
      inp.classList.add("incorrect");
    } else {
      inp.classList.remove("incorrect");
    }
  });
}

hintButton.addEventListener("click", () => {
  hintModeActive = !hintModeActive;
  hintButton.classList.toggle("active", hintModeActive);
  applyHintMode();
});

/* ==========================
   Win Detection
========================== */

function checkWin() {
  if (hasWon) return;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = solutionRows[r][c];
      if (ch === "#") continue;
      const meta = cellMeta[r][c];
      if (!meta || !meta.cell) return;
      const inp = meta.cell.querySelector("input");
      if (!inp) return;
      const val = inp.value.toUpperCase();
      if (!val || val !== ch.toUpperCase()) {
        return;
      }
    }
  }

  onWin();
}

function onWin() {
  hasWon = true;
  if (navigator.vibrate) {
    try { navigator.vibrate(120); } catch (e) {}
  }
  startConfetti();

  winMessage.style.display = "block";
  setTimeout(() => {
    winMessage.style.opacity = "1";
    winMessage.style.transform = "translateY(0)";
  }, 50);

  setTimeout(() => {
    restartBtn.style.opacity = "1";
    restartBtn.style.transform = "translateY(0)";
  }, 600);

  letterInputs.forEach(inp => inp.readOnly = true);
}

/* ==========================
   Restart
========================== */

function restartGame() {
  initCrossword();
}

/* ==========================
   Init
========================== */

initCrossword();
</script>
