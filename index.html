<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreuzworträtsel – Weihnachten</title>

  <!-- Festive Calligraphy Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding-top: 20px;
      background: linear-gradient(#f8f8f8, #d8e3f0);
      background-image:
        url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Ctext x="10" y="55" font-size="20" fill="%23e0e0e0"%3E✻%3C/text%3E%3C/svg%3E'),
        url('data:image/svg+xml,%3Csvg width="120" height="120" xmlns="http://www.w3.org/2000/svg"%3E%3Ctext x="15" y="65" font-size="22" fill="%23f2d4d4"%3E✦%3C/text%3E%3C/svg%3E');
      background-repeat: repeat;
      overflow-x: hidden;
      padding-bottom: 75px; /* base room so clue bar doesn't overlap content on desktop */
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #b30000;
      margin: 0;
      text-shadow: 0 0 4px rgba(255,255,255,0.7);
    }

    h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: #b30000;
      margin: 0;
      text-shadow: 0 0 4px rgba(255,255,255,0.7);
    }

    /* Snowflakes */
    .snowflake {
      position: fixed;
      top: -10px;
      color: white;
      font-size: 20px;
      opacity: 0.75;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    /* Top bar */
    #infoBar {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    #hintButton {
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      background: white;
      color: #b30000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 9px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    #hintButton svg {
      width: 18px;
      height: 18px;
      stroke: #b30000;
      stroke-width: 2;
    }

    #hintButton:hover {
      background: #ffecec;
      transform: translateY(-1px);
    }

    #hintButton.active {
      background: #b30000;
      color: white;
      box-shadow: 0 0 10px rgba(179,0,0,0.7);
    }
    #hintButton.active svg {
      stroke: #ffffff;
    }

    /* Wrapper so we can center / scroll horizontally if ever needed */
    #frameWrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      padding: 0 10px;
    }

    /* Puzzle frame – OPTION A: frame not scaled, just wraps puzzle */
    #frame {
      padding: 15px;
      border: 8px solid #b30000;
      border-radius: 20px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      margin-top: 20px;
      transition: all 0.8s ease;
      position: relative;
      transform-origin: top center;
      width: max-content; /* keep border hugging the puzzle */
    }

    /* Crossword grid */
    #puzzle {
      display: grid;
      grid-template-columns: repeat(15, min(32px, 5vw));
      grid-auto-rows: min(32px, 5vw);
      gap: 0;
      transition: opacity 0.6s ease;
      justify-content: center;
    }

    .cross-cell {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .cross-cell.block {
      background: #333;
      border: none;
    }

    .cross-cell.active-word {
      background: #fff6d5;
      box-shadow: 0 0 0 2px rgba(212,175,55,0.6);
    }

    .cross-cell.active-cell {
      background: #ffe4cc;
      box-shadow: 0 0 0 2px rgba(179,0,0,0.6);
    }

    .cross-input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      color: #222;
      line-height: 1; /* help avoid visual cropping */
    }

    .cross-input.incorrect {
      color: #b30000;
    }

    .cross-input.no-caret {
      caret-color: transparent;
    }

    .cross-input:focus {
      box-shadow: 0 0 0 2px rgba(179, 0, 0, 0.4);
      border-radius: 2px;
    }

    /* Number badges on start cells */
    .cell-number {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(179,0,0,0.4);
      font-size: 8px;
      color: #b30000;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      box-shadow: none;
    }

    /* original image hidden */
    #fullImage {
      display: false;
    }

    /* Win overlay */
    #winOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 14000;
    }

    #winMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(255,255,255,0.97);
      padding: 18px 22px 20px;
      border-radius: 16px;
      font-size: 17px;
      box-shadow: 0 0 18px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      display: none;
      text-align: center;
      max-width: 92vw;
      z-index: 15000;
    }

    #winMessage h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.3rem;
      margin: 0 0 8px;
      background: linear-gradient(45deg, #b30000, #d4af37, #008000);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 7px rgba(255,255,255,0.7);
      animation: winPop 0.9s ease-out forwards, glow 2s ease-in-out infinite alternate;
    }

    #winText {
      margin-top: 4px;
      margin-bottom: 8px;
    }

    #finalPhraseLetters {
      margin-top: 8px;
      display: inline-block;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      position: relative;
    }

    .final-letter {
      display: inline-block;
      opacity: 0;
      transform: translate(0, 30px);
      animation: letterIn 0.7s forwards;
    }

    @keyframes letterIn {
      0%   { opacity: 0; transform: translate(0, 40px) scale(0.8); }
      60%  { opacity: 1; transform: translate(0, -6px) scale(1.05); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    @keyframes winPop {
      0% { transform: translate(-50%, -50%) scale(0.5) rotate(-6deg); opacity: 0; }
      60% { transform: translate(-50%, -50%) scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes glow {
      0% { text-shadow: 0 0 6px rgba(255,255,255,0.6); }
      100% { text-shadow: 0 0 12px rgba(255,255,255,1); }
    }

    #restartButton {
      padding: 8px 16px;
      border-radius: 999px;
      background: #b30000;
      color: white;
      border: none;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.7s ease, transform 0.7s ease, background 0.2s ease;
    }

    #restartButton:hover {
      background: #d00000;
    }

    #closeWin {
      position: absolute;
      top: 8px;
      right: 10px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: #666;
    }

    #closeWin:hover {
      color: #b30000;
    }

    @keyframes confettiFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* Final cells highlight */
    .final-highlight {
      animation: finalPulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes finalPulse {
      0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.2); background: #fffbe6; }
      100% { box-shadow: 0 0 0 4px rgba(212,175,55,0.7); background: #fff6c2; }
    }

    /* Bottom clue popup (desktop baseline) */
    #clueBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      transform: translateY(100%);
      transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease, bottom 0.2s ease;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 -4px 14px rgba(0,0,0,0.25);
      padding: 10px 16px 14px;
      display: flex;
      justify-content: center;
      z-index: 9999;
    }

    #clueInner {
      max-width: 800px;
      width: 100%;
      text-align: center;
      font-size: 15px;
      color: #333;
    }

    #clueLabel {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #b30000;
      margin-bottom: 4px;
      font-weight: 600;
    }

    #clueText {
      font-size: 15px;
      font-weight: 600;
    }

    #clueBar.visible {
      transform: translateY(0);
    }

    /* Clue pulse animation when switching words */
    #clueBar.pulse {
      animation: cluePulse 0.18s ease-out;
    }

    @keyframes cluePulse {
      0%   { transform: translateY(0) scale(0.98); opacity: 0.9; }
      60%  { transform: translateY(-2px) scale(1.03); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* When the on-screen keyboard is open, we push the clue bar up
       so it sits above the keyboard and overlaps the puzzle if needed */
    body.keyboard-open #clueBar {
      bottom: 40vh; /* tune if needed */
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 600px) {
      body {
        padding-bottom: 140px; /* extra room because of keyboard movement */
      }

      /* don't transform the frame, just the grid size */
      #frame {
        max-width: 100%;
        transform: none !important;
      }

      /* OPTION A: scale grid cells so puzzle ~fits screen width */
      #puzzle {
        grid-template-columns: repeat(15, min(6vw, 24px));
        grid-auto-rows: min(6vw, 24px);
      }

      /* larger, responsive font so it's crisp and not cropped */
      .cross-input {
        font-size: clamp(14px, 4.5vw, 18px) !important;
      }

      #frameWrapper {
        justify-content: center;
        overflow-x: hidden;
      }

      #clueText {
        font-size: 14px;
      }
    }
  </style>
</head>

  { num: 16, answer: "SITTE",     row: 0, col: 3,  dir: "down", clue: "traditionelle Verhaltensregel" },

];


/* ==========================
   Global Variables
========================== */

const puzzleEl = document.getElementById("puzzle");
const winOverlay = document.getElementById("winOverlay");
const winMessage = document.getElementById("winMessage");
const restartBtn = document.getElementById("restartButton");
const closeWinBtn = document.getElementById("closeWin");
const hintButton = document.getElementById("hintButton");
const clueBar = document.getElementById("clueBar");
const clueTextEl = document.getElementById("clueText");
const clueLabelEl = document.getElementById("clueLabel");
const finalPhraseLettersEl = document.getElementById("finalPhraseLetters");

const finalPhrase = "Felice hat einen nicen Hintern";

const letterInputs = [];
let cellMeta = [];
let activeEntryIndex = null;
let activeDir = null;
let lastRow = null;
let lastCol = null;
let hintModeActive = false;
let hasWon = false;
let lastClueEntryIndex = null;
let lastKeyWasBackspace = false;

/* Confetti setup */
const confettiCanvas = document.getElementById("confettiCanvas");
const ctx = confettiCanvas.getContext("2d");
let confettiPieces = [];
let confettiActive = false;

/* ==========================
   Confetti Engine
========================== */

function startConfetti() {
  confettiActive = true;
  confettiCanvas.style.display = "block";
  resizeCanvas();
  createConfetti();
  requestAnimationFrame(updateConfetti);
  setTimeout(() => fadeOutConfetti(), 2000);
}

function fadeOutConfetti() {
  confettiCanvas.style.animation = "confettiFadeOut 2.5s forwards";
  setTimeout(() => {
    stopConfetti();
    confettiCanvas.style.animation = "";
  }, 2100);
}

function stopConfetti() {
  confettiActive = false;
  confettiPieces = [];
  confettiCanvas.style.display = "none";
}

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);

function createConfetti() {
  const colors = ["#b30000", "#d4af37", "#ffffff", "#008000"];
  confettiPieces = [];
  for (let i = 0; i < 260; i++) {
    confettiPieces.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height - confettiCanvas.height,
      size: Math.random() * 7 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 3 + 1.5,
      angle: Math.random() * Math.PI * 2,
      spin: Math.random() * 0.12 - 0.06
    });
  }
}

function updateConfetti() {
  if (!confettiActive) return;

  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  confettiPieces.forEach(p => {
    p.y += p.speed;
    p.angle += p.spin;

    ctx.fillStyle = p.color;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  });

  confettiPieces = confettiPieces.filter(p => p.y < confettiCanvas.height);

  requestAnimationFrame(updateConfetti);
}

/* ==========================
   Crossword Setup
========================== */

let finalCells = [];

function initCrossword() {
  puzzleEl.innerHTML = "";
  letterInputs.length = 0;
  cellMeta = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => ({ across: null, down: null, cell: null, startNums: [] }))
  );
  activeEntryIndex = null;
  activeDir = null;
  lastRow = null;
  lastCol = null;
  hasWon = false;
  hintModeActive = false;
  hintButton.classList.remove("active");
  clueBar.classList.remove("visible");
  lastClueEntryIndex = null;

  winOverlay.style.display = "none";
  winMessage.style.display = "none";
  winMessage.style.opacity = "0";
  winMessage.style.transform = "translate(-50%, -50%) scale(0.9)";
  restartBtn.style.opacity = "0";
  restartBtn.style.transform = "translateY(8px)";
  finalPhraseLettersEl.innerHTML = "";

  // Build grid
  for (let r = 0; r < ROWS; r++) {
    const rowStr = solutionRows[r];
    for (let c = 0; c < COLS; c++) {
      const ch = rowStr[c];
      const cell = document.createElement("div");
      cell.className = "cross-cell";

      if (ch === "#") {
        cell.classList.add("block");
      } else {
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 1;
        input.className = "cross-input no-caret";
        input.dataset.correct = ch.toUpperCase();
        input.dataset.row = r;
        input.dataset.col = c;

        input.addEventListener("keydown", (ev) => {
          lastKeyWasBackspace = (ev.key === "Backspace");
        });

        input.addEventListener("input", handleInput);
        input.addEventListener("focus", () => {
          selectCell(r, c, false, true); // preserve direction on focus
          document.body.classList.add('keyboard-open');
          setTimeout(() => input.select(), 0);
        });
        input.addEventListener("click", () => {
          selectCell(r, c, true, false); // allow toggling direction on click
        });
        input.addEventListener("blur", () => {
          input.classList.add("no-caret");
          // small delay so focus can move to another input without flicker
          setTimeout(() => {
            const ae = document.activeElement;
            if (!ae || !ae.classList || !ae.classList.contains('cross-input')) {
              document.body.classList.remove('keyboard-open');
            }
          }, 100);
        });

        cell.appendChild(input);
        letterInputs.push(input);

        cellMeta[r][c].cell = cell;
      }
      puzzleEl.appendChild(cell);
    }
  }

  // Map entries to cells and mark start cells
  entries.forEach((entry, entryIndex) => {
    entry.cells = [];
    const len = entry.answer.length;
    for (let i = 0; i < len; i++) {
      const rr = entry.row + (entry.dir === "down" ? i : 0);
      const cc = entry.col + (entry.dir === "across" ? i : 0);
      entry.cells.push({ row: rr, col: cc });

      if (!cellMeta[rr][cc]) continue;
      cellMeta[rr][cc][entry.dir] = { entryIndex, index: i };
    }

    // Mark start cell with number
    const startPos = entry.cells[0];
    const meta = cellMeta[startPos.row][startPos.col];
    if (meta && meta.cell) {
      if (!meta.startNums.length || entry.num < Math.min(...meta.startNums)) {
        meta.startNums.push(entry.num);
        const oldMarker = meta.cell.querySelector(".cell-number");
        if (oldMarker) oldMarker.remove();
        const badge = document.createElement("div");
        badge.className = "cell-number";
        badge.textContent = entry.num;
        meta.cell.appendChild(badge);
      }
    }
  });

  computeFinalCells();
}

function computeFinalCells() {
  finalCells = [];
  const targetLetters = finalPhrase.replace(/ /g, "").length;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (solutionRows[r][c] !== "#" && finalCells.length < targetLetters) {
        finalCells.push({ row: r, col: c });
      }
    }
  }
}

/* ==========================
   Selection & Highlighting
========================== */

function clearHighlights() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const meta = cellMeta[r][c];
      if (meta && meta.cell) {
        meta.cell.classList.remove("active-word", "active-cell");
      }
    }
  }
}

function showClueForEntry(entryIndex) {
  if (entryIndex == null) {
    clueBar.classList.remove("visible");
    clueBar.classList.remove("pulse");
    clueTextEl.textContent = "";
    clueLabelEl.textContent = "Frage";
    lastClueEntryIndex = null;
    return;
  }
  const entry = entries[entryIndex];

  // Pulse only when switching to a different entry
  if (entryIndex !== lastClueEntryIndex) {
    clueBar.classList.remove("pulse");
    void clueBar.offsetWidth; // reflow
    clueBar.classList.add("pulse");
  }

  clueTextEl.textContent = entry.clue || "";
  clueLabelEl.textContent = "Frage " + entry.num;
  clueBar.classList.add("visible");
  lastClueEntryIndex = entryIndex;
}

/**
 * selectCell(row, col, toggleDirection=false, preserveDir=false)
 */
function selectCell(row, col, toggleDirection = false, preserveDir = false) {
  const meta = cellMeta[row][col];
  if (!meta || !meta.cell) {
    activeEntryIndex = null;
    activeDir = null;
    clearHighlights();
    showClueForEntry(null);
    return;
  }

  const hasAcross = !!meta.across;
  const hasDown = !!meta.down;
  const sameCell = (lastRow === row && lastCol === col);
  const prevEntryIndex = activeEntryIndex;

  let chosenDir = null;
  let chosenEntryIndex = null;

  if (toggleDirection && sameCell && hasAcross && hasDown) {
    if (activeDir === "across" && hasDown) {
      chosenDir = "down";
      chosenEntryIndex = meta.down.entryIndex;
    } else if (activeDir === "down" && hasAcross) {
      chosenDir = "across";
      chosenEntryIndex = meta.across.entryIndex;
    } else if (hasAcross) {
      chosenDir = "across";
      chosenEntryIndex = meta.across.entryIndex;
    } else if (hasDown) {
      chosenDir = "down";
      chosenEntryIndex = meta.down.entryIndex;
    }
  } else if (preserveDir && activeDir && meta[activeDir]) {
    chosenDir = activeDir;
    chosenEntryIndex = meta[activeDir].entryIndex;
  } else {
    if (hasAcross) {
      chosenDir = "across";
      chosenEntryIndex = meta.across.entryIndex;
    } else if (hasDown) {
      chosenDir = "down";
      chosenEntryIndex = meta.down.entryIndex;
    }
  }

  activeEntryIndex = chosenEntryIndex;
  activeDir = chosenDir;
  lastRow = row;
  lastCol = col;

  clearHighlights();

  if (activeEntryIndex != null) {
    const entry = entries[activeEntryIndex];
    entry.cells.forEach(pos => {
      const cell = cellMeta[pos.row][pos.col].cell;
      if (cell) {
        cell.classList.add("active-word");
      }
    });
    const thisCell = cellMeta[row][col].cell;
    if (thisCell) thisCell.classList.add("active-cell");
  } else {
    const thisCell = cellMeta[row][col].cell;
    if (thisCell) thisCell.classList.add("active-cell");
  }

  showClueForEntry(activeEntryIndex);

  const newWordSelected =
    activeEntryIndex != null &&
    activeEntryIndex !== prevEntryIndex &&
    !(sameCell && toggleDirection);

  if (activeEntryIndex != null && newWordSelected) {
    const entry = entries[activeEntryIndex];
    const firstPos = entry.cells[0];
    const m2 = cellMeta[firstPos.row][firstPos.col];
    if (m2 && m2.cell) {
      const firstInput = m2.cell.querySelector("input");
      if (firstInput) {
        firstInput.classList.add("no-caret");
        firstInput.focus();
        setTimeout(() => firstInput.select(), 0);
      }
    }
  } else {
    const m = cellMeta[row][col];
    if (m && m.cell) {
      const inp = m.cell.querySelector("input");
      if (inp) {
        inp.classList.add("no-caret");
      }
    }
  }
}

/* ==========================
   Input / Hint / Movement
========================== */

function handleInput(e) {
  const input = e.target;
  const row = parseInt(input.dataset.row, 10);
  const col = parseInt(input.dataset.col, 10);

  input.classList.remove("no-caret");

  let val = input.value;

  if (!val) {
    if (lastKeyWasBackspace && activeEntryIndex != null && activeDir) {
      const metaDir = cellMeta[row][col][activeDir];
      if (metaDir) {
        const entry = entries[metaDir.entryIndex];
        for (let i = metaDir.index - 1; i >= 0; i--) {
          const prevPos = entry.cells[i];
          const prevMeta = cellMeta[prevPos.row][prevPos.col];
          if (prevMeta && prevMeta.cell) {
            const prevInput = prevMeta.cell.querySelector("input");
            if (prevInput) {
              selectCell(prevPos.row, prevPos.col, false, true);
              prevInput.classList.add("no-caret");
              prevInput.focus();
              break;
            }
          }
        }
      }
    }
    if (hintModeActive) applyHintMode();
    lastKeyWasBackspace = false;
    return;
  }

  val = val.charAt(0).toUpperCase();
  input.value = val;

  if (hintModeActive) {
    applyHintMode();
  }

  if (activeEntryIndex != null && activeDir) {
    const metaDir = cellMeta[row][col][activeDir];
    if (metaDir) {
      const entry = entries[metaDir.entryIndex];
      for (let i = metaDir.index + 1; i < entry.answer.length; i++) {
        const nextPos = entry.cells[i];
        const nextMeta = cellMeta[nextPos.row][nextPos.col];
        if (nextMeta && nextMeta.cell) {
          const nextInput = nextMeta.cell.querySelector("input");
          if (nextInput && !nextInput.value) {
            selectCell(nextPos.row, nextPos.col, false, true);
            nextInput.classList.add("no-caret");
            nextInput.focus();
            break;
          }
        }
      }
    }
  } else {
    if (col + 1 < COLS && cellMeta[row][col + 1].cell) {
      const nextInput = cellMeta[row][col + 1].cell.querySelector("input");
      if (nextInput) {
        nextInput.classList.add("no-caret");
        nextInput.focus();
      }
    }
  }

  lastKeyWasBackspace = false;
  checkWin();
}

function applyHintMode() {
  if (!hintModeActive) {
    letterInputs.forEach(inp => inp.classList.remove("incorrect"));
    return;
  }
  letterInputs.forEach(inp => {
    const val = inp.value.toUpperCase();
    const correct = inp.dataset.correct;
    if (val && val !== correct) {
      inp.classList.add("incorrect");
    } else {
      inp.classList.remove("incorrect");
    }
  });
}

hintButton.addEventListener("click", () => {
  hintModeActive = !hintModeActive;
  hintButton.classList.toggle("active", hintModeActive);
  applyHintMode();
});

/* ==========================
   Win Detection
========================== */

function checkWin() {
  if (hasWon) return;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = solutionRows[r][c];
      if (ch === "#") continue;
      const meta = cellMeta[r][c];
      if (!meta || !meta.cell) return;
      const inp = meta.cell.querySelector("input");
      if (!inp) return;
      const val = inp.value.toUpperCase();
      if (!val || val !== ch.toUpperCase()) {
        return;
      }
    }
  }

  onWin();
}

function onWin() {
  hasWon = true;
  if (navigator.vibrate) {
    try { navigator.vibrate(120); } catch (e) {}
  }
  startConfetti();

  finalCells.forEach(pos => {
    const meta = cellMeta[pos.row][pos.col];
    if (meta && meta.cell) {
      meta.cell.classList.add("final-highlight");
    }
  });

  finalPhraseLettersEl.innerHTML = "";
  let delay = 0;
  for (const ch of finalPhrase) {
    const span = document.createElement("span");
    span.textContent = ch;
    span.className = "final-letter";
    span.style.animationDelay = (delay / 1000) + "s";
    delay += 50;
    finalPhraseLettersEl.appendChild(span);
  }

  winOverlay.style.display = "block";
  winMessage.style.display = "block";
  setTimeout(() => {
    winMessage.style.opacity = "1";
    winMessage.style.transform = "translate(-50%, -50%) scale(1)";
  }, 50);

  setTimeout(() => {
    restartBtn.style.opacity = "1";
    restartBtn.style.transform = "translateY(0)";
  }, 600);

  letterInputs.forEach(inp => inp.readOnly = true);
}

/* ==========================
   Close & Restart
========================== */

function restartGame() {
  initCrossword();
}

closeWinBtn.addEventListener("click", () => {
  winOverlay.style.display = "none";
  winMessage.style.display = "none";
});

/* ==========================
   Init
========================== */

initCrossword();
</script>
